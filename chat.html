<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d36"><title>محادثات مواطن الإخبارية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;background:#f3f6fa;color:#17243a}.top{background:linear-gradient(120deg,#101d36,#203657);color:white}.bubble{background:white;border:1px solid #e6eaf0;border-radius:13px;padding:10px 13px;max-width:88%;margin:8px 0}.mine{background:#e9f7ee;border-color:#cdebd7;margin-right:auto}.muted{color:#7b8494}.btn{background:#d5ad59;color:#17233a;font-weight:900;border-radius:9px;padding:10px 15px}.field{width:100%;border:1px solid #dce2eb;border-radius:9px;padding:11px;background:white}</style></head>
<body><header class="top p-4"><div class="max-w-4xl mx-auto flex items-center justify-between gap-3"><div><h1 class="text-xl font-black">مواطن الإخبارية · المحادثات</h1><p class="text-xs text-gray-300">مجتمع الحوار والتواصل</p></div><a class="text-sm border border-white/30 rounded-lg px-3 py-2" href="/">العودة للموقع</a></div></header>
<main class="max-w-4xl mx-auto p-3 sm:p-5"><section class="bg-white rounded-2xl p-4 shadow-sm mb-4"><div class="grid sm:grid-cols-2 gap-3"><div><label class="text-sm font-bold block mb-1">اسمك في المحادثة</label><input id="nickname" class="field" maxlength="30" placeholder="اكتب اسماً مستعاراً"></div><div><label class="text-sm font-bold block mb-1">الغرفة</label><select id="roomSelect" class="field"><option>جارٍ تحميل الغرف...</option></select></div></div><p id="status" class="text-xs muted mt-3">يمكنك الدخول كزائر دون إنشاء حساب.</p></section>
<section class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="p-4 border-b flex justify-between items-center"><strong id="roomTitle">الدردشة العامة</strong><span class="text-xs text-green-700">● غرفة عامة</span></div><div id="messages" class="p-3 min-h-72 max-h-[55vh] overflow-y-auto bg-slate-50"><p class="muted text-center py-8">جارٍ تحميل المحادثة...</p></div><form id="sendForm" class="p-3 border-t flex gap-2"><input id="messageInput" class="field" maxlength="1500" placeholder="اكتب رسالتك..." autocomplete="off"><button class="btn shrink-0">إرسال</button></form></section><p class="text-xs muted text-center mt-4">يرجى احترام الآخرين وعدم نشر معلومات شخصية أو محتوى مسيء.</p></main>
<script>
const db=window.supabase.createClient("https://sfomyyvfxyvzsbmecqob.supabase.co","sb_publishable_Un8Xw6RLTCjrUM6hJjXGCg_GDvIwk21");
const $=id=>document.getElementById(id);let roomId=null,channel=null,visitorId=localStorage.getItem("mw_chat_visitor")||crypto.randomUUID();localStorage.setItem("mw_chat_visitor",visitorId);
$("nickname").value=localStorage.getItem("mw_chat_name")||"";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadRooms(){const {data,error}=await db.from("chat_rooms").select("id,name").eq("is_active",true).eq("is_public",true).order("created_at");if(error){$("status").textContent="تعذر تحميل الغرف حالياً.";return;} $("roomSelect").innerHTML=(data||[]).map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join("");if(data?.length){roomId=data[0].id;await openRoom(roomId);}else $("messages").textContent="لا توجد غرف متاحة حالياً.";}
async function loadMessages(){const {data,error}=await db.from("chat_messages").select("id,nickname,body,visitor_id,created_at").eq("room_id",roomId).is("deleted_at",null).order("created_at",{ascending:true}).limit(100);if(error){$("messages").textContent="تعذر تحميل الرسائل.";return;}render(data||[]);}
function render(rows){$("messages").innerHTML=rows.map(m=>'<div class="bubble '+(m.visitor_id===visitorId?'mine':'')+'"><div class="text-xs font-black text-slate-500 mb-1">'+esc(m.nickname)+' · '+new Date(m.created_at).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})+'</div><div class="whitespace-pre-wrap break-words">'+esc(m.body)+'</div></div>').join("")||'<p class="muted text-center py-8">كن أول من يبدأ الحديث 👋</p>';$("messages").scrollTop=$("messages").scrollHeight;}
async function openRoom(id){roomId=id;if(channel)await db.removeChannel(channel);const opt=$("roomSelect").selectedOptions[0];$("roomTitle").textContent=opt?.textContent||"غرفة محادثة";await loadMessages();channel=db.channel("mw-room-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages",filter:"room_id=eq."+id},payload=>{const row=payload.new;if(row.deleted_at)return;const el=document.createElement("div");el.innerHTML='<div class="bubble '+(row.visitor_id===visitorId?'mine':'')+'"><div class="text-xs font-black text-slate-500 mb-1">'+esc(row.nickname)+' · '+new Date(row.created_at).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})+'</div><div class="whitespace-pre-wrap break-words">'+esc(row.body)+'</div></div>';$("messages").appendChild(el.firstElementChild);$("messages").scrollTop=$("messages").scrollHeight;}).subscribe();}
$("roomSelect").addEventListener("change",e=>openRoom(e.target.value));
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();const nickname=$("nickname").value.trim(),body=$("messageInput").value.trim();if(nickname.length<2){$("status").textContent="اكتب اسماً من حرفين على الأقل.";return;}if(!body||!roomId)return;localStorage.setItem("mw_chat_name",nickname);$("messageInput").value="";const {error}=await db.from("chat_messages").insert({room_id:roomId,visitor_id:visitorId,nickname,body});if(error){$("status").textContent="تعذر إرسال الرسالة. حاول مجدداً."; $("messageInput").value=body;}else $("status").textContent="تم إرسال رسالتك.";});
loadRooms();
</script></body></html>
