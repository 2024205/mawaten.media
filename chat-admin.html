<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d36"><title>إدارة شات مواطن</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;background:#eef1f6;color:#17243a}.top{background:#101d36;color:white}.card{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:17px}.field{width:100%;border:1px solid #dce2eb;border-radius:9px;padding:11px;background:white}.gold{background:#d5ad59;color:#17233a;font-weight:900;border-radius:9px;padding:10px 15px}.red{background:#a52b2b;color:white;border-radius:8px;padding:8px 12px}.item{border:1px solid #e3e8ef;border-radius:10px;padding:13px;margin-top:10px}</style></head><body><header class="top p-4"><div class="max-w-4xl mx-auto flex items-center justify-between"><div><h1 class="font-black text-xl">إدارة شات مواطن</h1><p id="who" class="text-xs text-slate-300">منطقة المالك والمشرفين</p></div><a href="/" class="border border-white/30 rounded-lg px-3 py-2 text-sm">الموقع</a></div></header><main class="max-w-4xl mx-auto p-4 space-y-4"><section id="login" class="card max-w-md mx-auto"><h2 class="font-black text-lg mb-3">دخول الإدارة</h2><input id="email" class="field mb-2" type="email" placeholder="البريد الإلكتروني"><input id="password" class="field mb-3" type="password" placeholder="كلمة المرور"><button id="loginBtn" class="gold w-full">تسجيل الدخول</button><p id="msg" class="text-sm mt-3 text-red-700"></p></section><section id="panel" class="hidden space-y-4"><div class="card"><h2 class="font-black text-lg mb-3">إنشاء غرفة جديدة</h2><label class="text-sm font-bold block mb-1">اسم الغرفة</label><input id="roomName" class="field mb-3" maxlength="60" placeholder="مثلاً: أخبار اليمن"><label class="text-sm font-bold block mb-1">وصف الغرفة</label><input id="roomDesc" class="field mb-3" maxlength="180" placeholder="وصف مختصر"><label class="flex gap-2 items-center mb-4"><input id="isPublic" type="checkbox" checked> غرفة عامة يراها الزوار</label><button id="createBtn" class="gold w-full">إنشاء الغرفة</button><p id="createMsg" class="text-sm mt-2"></p></div><div class="card"><div class="flex items-center justify-between"><h2 class="font-black text-lg">الغرف الحالية</h2><button id="refresh" class="text-sm text-blue-700">تحديث</button></div><div id="rooms">جارٍ التحميل...</div></div><div class="card"><p class="text-sm text-slate-600">هذه لوحة إدارة أولية: يمكنك إنشاء الغرف وإظهارها أو إيقافها وحذفها. سنضيف تعيين مشرفين وإدارة الرسائل والرسائل الخاصة في المرحلة التالية.</p><button id="logout" class="red mt-3">تسجيل الخروج</button></div></section></main>
<script>
const db=window.supabase.createClient("https://sfomyyvfxyvzsbmecqob.supabase.co","sb_publishable_Un8Xw6RLTCjrUM6hJjXGCg_GDvIwk21");const $=id=>document.getElementById(id);let role=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function verify(){const {data:{session}}=await db.auth.getSession();if(!session){$("login").classList.remove("hidden");$("panel").classList.add("hidden");return;}const {data,error}=await db.from("admins").select("role").eq("user_id",session.user.id).maybeSingle();if(error||!data||!["owner","admin"].includes(data.role)){await db.auth.signOut();$("msg").textContent="هذا الحساب غير مخول لإدارة الشات.";return;}role=data.role;$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("who").textContent=(session.user.email||"حساب الإدارة")+" · "+(role==="owner"?"المالك الرئيسي":"مشرف معتمد");await loadRooms();}
async function loadRooms(){const {data,error}=await db.from("chat_rooms").select("*").order("created_at",{ascending:false});if(error){$("rooms").textContent="تعذر تحميل الغرف.";return;}$("rooms").innerHTML=(data||[]).map(r=>'<div class="item"><div class="flex justify-between gap-3 items-start"><div><strong>'+esc(r.name)+'</strong><p class="text-xs text-slate-500">'+esc(r.description||"")+'</p><p class="text-xs mt-1">'+(r.is_public?"عامة":"خاصة")+' · '+(r.is_active?"نشطة":"متوقفة")+'</p></div><div class="flex flex-wrap gap-2"><button class="text-xs border rounded-lg px-3 py-2" onclick="toggleRoom(\''+r.id+'\','+(!r.is_active)+')">'+(r.is_active?"إيقاف":"تفعيل")+'</button><button class="red text-xs" onclick="removeRoom(\''+r.id+'\')">حذف</button></div></div></div>').join("")||"لا توجد غرف بعد.";}
window.toggleRoom=async(id,value)=>{const {error}=await db.from("chat_rooms").update({is_active:value}).eq("id",id);if(error)alert("تعذر تحديث الغرفة");await loadRooms();};
window.removeRoom=async id=>{if(!confirm("هل تريد حذف الغرفة ورسائلها نهائياً؟"))return;const {error}=await db.from("chat_rooms").delete().eq("id",id);if(error)alert("تعذر حذف الغرفة");await loadRooms();};
$("loginBtn").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("msg").textContent="تعذر تسجيل الدخول؛ تحقق من البيانات.";return;}await verify();};
$("createBtn").onclick=async()=>{const name=$("roomName").value.trim();if(name.length<2){$("createMsg").textContent="اكتب اسماً واضحاً للغرفة.";return;}const {data:{user}}=await db.auth.getUser();const {error}=await db.from("chat_rooms").insert({name,description:$("roomDesc").value.trim(),is_public:$("isPublic").checked,created_by:user.id});$("createMsg").textContent=error?"تعذر إنشاء الغرفة.":"تم إنشاء الغرفة.";if(!error){$("roomName").value="";$("roomDesc").value="";await loadRooms();}};
$("refresh").onclick=loadRooms;$("logout").onclick=async()=>{await db.auth.signOut();location.reload();};verify();
</script></body></html>
